<title>Beyond the R1s</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#f5f6f7; --surface:#ffffff; --ink:#15202b; --ink-2:#4a5561; --ink-3:#7b8590; --rule:#dfe3e7; --rule-2:#eceff2;
  --accent:#eb6834; --accent-soft:#fdeee6;
  --r1:#2a78d6; --r2:#eb6834; --rcu:#1baf7a; --oth:#eda100; --non:#9aa3ac; --r1-wash:rgba(42,120,214,.10); --r2-wash:rgba(235,104,52,.12);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181c; --surface:#1c2126; --ink:#f1f3f5; --ink-2:#b8c0c8; --ink-3:#8a949e; --rule:#2e353c; --rule-2:#262c32;
  --accent:#f07a48; --accent-soft:#3a271e; --r1:#3987e5; --r2:#d95926; --rcu:#199e70; --oth:#c98500; --non:#6f7982; --r1-wash:rgba(57,135,229,.16); --r2-wash:rgba(217,89,38,.18);
}}
:root[data-theme="dark"]{
  --bg:#14181c; --surface:#1c2126; --ink:#f1f3f5; --ink-2:#b8c0c8; --ink-3:#8a949e; --rule:#2e353c; --rule-2:#262c32;
  --accent:#f07a48; --accent-soft:#3a271e; --r1:#3987e5; --r2:#d95926; --rcu:#199e70; --oth:#c98500; --non:#6f7982; --r1-wash:rgba(57,135,229,.16); --r2-wash:rgba(217,89,38,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:32px 72px}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
header.masthead{display:grid;grid-template-columns:1fr;gap:20px;padding-bottom:28px;border-bottom:1px solid var(--rule)}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.01em}
.masthead .dek{font-size:clamp(17px,2vw,20px);color:var(--ink-2);max-width:62ch;line-height:1.5}
.masthead .meta{display:flex;flex-wrap:wrap;gap:10px 28px;font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:32px}
.kpi{background:var(--surface);padding:18px 20px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:clamp(30px,3.6vw,42px);font-weight:600;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.5em;font-weight:500;color:var(--ink-3);margin-left:2px}
.kpi .l{font-size:13.5px;color:var(--ink-2)}
.kpi.hot .v{color:var(--accent)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
section{padding-top:56px}
section>.eyebrow{margin-bottom:10px}
section h2{font-family:var(--serif);font-weight:600;font-size:clamp(24px,3vw,32px);line-height:1.2;letter-spacing:-.01em;max-width:30ch}
.lede{font-size:17.5px;color:var(--ink-2);max-width:66ch;margin-top:14px}
.prose{max-width:66ch;margin-top:18px;display:flex;flex-direction:column;gap:14px;color:var(--ink)}
.prose p{font-size:16px}
.fig{margin-top:28px;background:var(--surface);border:1px solid var(--rule);padding:20px 22px 16px}
.fig-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.fig-title{font-weight:600;font-size:15.5px}
.fig-sub{font-size:13px;color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.line{height:2px;width:14px;border-radius:1px}
svg{display:block;width:100%;height:auto;font-family:var(--sans)}
svg text{fill:var(--ink-2);font-size:12px}
svg .tick{fill:var(--ink-3);font-size:11.5px;font-family:var(--mono)}
svg .grid{stroke:var(--rule-2);stroke-width:1}
svg .axis{stroke:var(--rule);stroke-width:1}
svg .lbl{fill:var(--ink);font-size:12px;font-family:var(--mono);font-weight:500}
svg .lbl.muted{fill:var(--ink-3);font-weight:400}
svg .cat{fill:var(--ink);font-size:13px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:820px){.twin{grid-template-columns:1fr}}
.callout{margin-top:28px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:16px 20px;max-width:70ch}
.callout p{font-size:15.5px}
.callout strong{color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl{margin-top:22px;overflow-x:auto;background:var(--surface);border:1px solid var(--rule)}
th{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:left;padding:12px 14px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:13px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.pill.r1{border-color:var(--r1);color:var(--r1)} .pill.r2{border-color:var(--r2);color:var(--r2)} .pill.rcu{border-color:var(--rcu);color:var(--rcu)} .pill.oth{border-color:var(--oth);color:var(--oth)}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:28px}
.rec{background:var(--surface);padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px}
.rec h3{font-size:16.5px;font-weight:600;line-height:1.3}
.rec p{font-size:14.5px;color:var(--ink-2)}
.rec .n{font-family:var(--mono);font-size:12px;color:var(--accent)}
@media (max-width:820px){.recs{grid-template-columns:1fr}}
.method{margin-top:56px;padding-top:24px;border-top:1px solid var(--rule);color:var(--ink-2);font-size:14px;max-width:80ch;display:flex;flex-direction:column;gap:10px}
.method h3{font-size:13px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:12px;padding:6px 9px;border-radius:3px;opacity:0;transform:translate(-50%,calc(-100% - 10px));transition:opacity .12s;white-space:nowrap;z-index:9}
.tip.on{opacity:1}
svg .hit{fill:transparent}
svg .hit:hover+.mark, svg .bar:hover{filter:brightness(.9)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
